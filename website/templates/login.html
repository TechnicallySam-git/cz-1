<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem 2.5rem; border-radius: 12px; width: 280px; }
    input { width: 100%; padding: 0.5rem; margin: 0.4rem 0 1rem; border-radius: 6px;
            border: 1px solid #334155; background: #0f172a; color: #e2e8f0; box-sizing: border-box; }
    button { width: 100%; padding: 0.6rem; background: #38bdf8; border: none; border-radius: 6px;
             color: #0f172a; font-weight: bold; cursor: pointer; }
    .error { color: #f87171; font-size: 0.9rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Sign in</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
